<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prospect Intelligence – Clickable Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root[data-theme="dark"]{--bg:#101113;--card:#1d1f22;--ink:#EEF1EB;--mut:#a3a89f;--pd:#B4A9FE;--sd:#9AE69C;--dk:#2a2c30;--line:#2f3236}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.5 Manrope,system-ui,sans-serif}
h1,h2,h3,.dm{font-family:"DM Sans",system-ui,sans-serif;margin:0;letter-spacing:-.01em}
h1{font-size:28px}h2{font-size:18px}h3{font-size:15px}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh;gap:16px;padding:16px}
nav{background:var(--card);border-radius:28px;padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:16px;height:calc(100vh - 32px)}
.logo{display:flex;gap:10px;align-items:center;font:700 16px "DM Sans";padding:0 8px 14px}
.logo i{width:30px;height:30px;border-radius:10px;background:var(--pri);display:block}
nav button{all:unset;cursor:pointer;padding:11px 14px;border-radius:999px;display:flex;gap:10px;align-items:center;color:var(--mut);font-weight:600}
nav button:hover{background:var(--bg)}nav button.on{background:var(--pd);color:#fff}
:root[data-theme="dark"] nav button.on{color:#1c1640}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) nav button.on{color:#1c1640}}
main{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--card);border-radius:28px;padding:22px}
.dark{background:var(--dk);color:var(--on-dk)}.green{background:var(--sec);color:#10260f}.lav{background:var(--pri);color:#1c1640}
.row{display:flex;gap:16px;flex-wrap:wrap}.row>*{flex:1 1 220px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.big{font:700 44px/1 "DM Sans"}.mut{color:var(--mut)}.dark .mut,.green .mut,.lav .mut{color:inherit;opacity:.7}
.btn{all:unset;cursor:pointer;padding:11px 22px;border-radius:999px;font-weight:700;background:var(--pd);color:#fff;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:focus-visible,nav button:focus-visible,.tab:focus-visible,.chip:focus-visible,.seq-step:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
:root[data-theme="dark"] .btn{color:#1c1640}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#1c1640}}
.btn.sec{background:var(--bg);color:var(--ink)}.btn.inv{background:var(--dk);color:var(--on-dk)}.btn.out{background:none;border:2px solid var(--ink);color:var(--ink);padding:9px 20px}.btn[disabled]{opacity:.4;pointer-events:none}
.btn.sm{padding:6px 14px;font-size:12px}
.chip{all:unset;cursor:pointer;padding:6px 14px;border-radius:999px;background:var(--bg);font-weight:600;font-size:13px}.chip.on{background:var(--pri);color:#1c1640}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--bg)}
.High,.ok{background:var(--sec);color:#10260f}.Medium,.rev{background:var(--pri);color:#1c1640}.Low,.bad{background:#f3c7c3;color:#5c120d}
input,textarea,select{width:100%;padding:12px 16px;border-radius:18px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:210px;line-height:1.6;resize:vertical}label{display:block;font-weight:600;margin:12px 0 6px}
.tabs{display:flex;gap:6px;background:var(--card);padding:6px;border-radius:999px;width:fit-content;max-width:100%;overflow-x:auto}
.tab{all:unset;cursor:pointer;padding:8px 20px;border-radius:999px;font-weight:700}.tab.on{background:var(--dk);color:var(--on-dk)}
.sig{display:flex;gap:14px;align-items:flex-start;cursor:pointer;border:2px solid transparent}.sig.sel{border-color:var(--pd)}
.sig input{width:20px;height:20px;margin-top:3px;accent-color:#5B4B9E}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}th{text-align:left;color:var(--mut);font-weight:600;padding:8px}td{padding:12px 8px;border-top:1px solid var(--line)}tr.lk{cursor:pointer}tr.lk:hover td{background:var(--bg)}
.steps{display:flex;flex-direction:column;gap:12px;margin-top:16px}.st{display:flex;gap:12px;align-items:center;opacity:.45}.st.done,.st.act{opacity:1}
.dot{width:26px;height:26px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:13px}.done .dot{background:var(--sec);color:#10260f}.act .dot{background:var(--pri);color:#1c1640}
.bar{height:8px;border-radius:9px;background:var(--bg);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--pd);transition:width .5s}
.ang{cursor:pointer;border:2px solid transparent}.ang.sel{border-color:var(--pd)}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--dk);color:var(--on-dk);padding:10px 20px;border-radius:999px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:99}#toast.show{opacity:1}
.ev-list-scroll{max-height:290px;overflow-y:auto;overflow-x:hidden;padding-right:6px;margin-top:6px;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.ev-list-scroll::-webkit-scrollbar{width:5px}.ev-list-scroll::-webkit-scrollbar-track{background:transparent}.ev-list-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px}
.ev{padding:10px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;font-size:13px;align-items:center}.ev>*:first-child{min-width:0;flex:1}.ev>*:last-child{flex-shrink:0}
/* Sequence timeline styles */
.seq-bar{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.seq-step{all:unset;cursor:pointer;flex:1 1 160px;min-width:155px;background:var(--card);border:2px solid transparent;border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;transition:border-color .15s,background .15s}
.seq-step:hover{background:var(--bg)}
.seq-step.sel{border-color:var(--pd);background:var(--card)}
.seq-top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;font-weight:700}
.seq-day{color:var(--mut);font-weight:700;font-size:12px}
.seq-title{font-family:"DM Sans",system-ui,sans-serif;font-weight:700;font-size:14px;margin-top:2px}
.seq-sub{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-sw{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media(max-width:800px){.app{grid-template-columns:1fr;padding:12px}nav{position:static;height:auto;flex-direction:row;overflow-x:auto;border-radius:24px}.logo{display:none}nav button{white-space:nowrap}h1{font-size:24px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

const SEQ_TEMPLATE=[
 {step:1,day:'Day 1',label:'Initial outreach',ch:'Email',goal:'Hook with primary signal & establish relevance'},
 {step:2,day:'Day 3',label:'LinkedIn connect',ch:'LinkedIn',goal:'Low-friction social touch referencing Day 1 note'},
 {step:3,day:'Day 6',label:'Value follow-up',ch:'Email',goal:'Share relevant case study & secondary signal insight'},
 {step:4,day:'Day 10',label:'Breakup / check-in',ch:'Email',goal:'Polite close-the-loop note with no-pressure CTA'}
];

const S={

const curP=()=>PROSPECTS[S.pid];

function buildStepContent(p,stepIdx){
 const tpl=SEQ_TEMPLATE[stepIdx];
 const person=p.people[p.contactIdx]||p.people[0];
 const first=person.name.split(' ')[0];
 const greet=S.tone==='Conversational'?`Hi ${first}`:`Hello ${first}`;
 const isCustom=p.ang==='c'&&p.custom;
 const angObj=isCustom?{t:p.custom,off:'Enterprise AI platform'}:(p.angles[p.ang]||p.angles[0]);
 const sigs=p.signals.filter(x=>p.sel.includes(x.id));
 const priSig=sigs[0]||p.signals[0];
 const secSig=sigs[1]||p.signals[1]||priSig;

 let subj='',body='';
 if(stepIdx===0){
  subj= isCustom
   ? `Exploring ${p.custom.slice(0,38)} at ${p.name}`
   : `${p.name}’s ${priSig.t.toLowerCase()} — quick thought for ${first}`;
  const hook=isCustom
   ? `Given ${p.name}’s recent momentum (${priSig.t.toLowerCase()}), I was thinking about how your team is approaching ${p.custom.toLowerCase()}.`
   : `I caught the news about ${p.name}’s ${priSig.t.toLowerCase()}${sigs.length>1?` alongside the ${secSig.t.toLowerCase()}`:''} — exciting chapter for the ${person.dept.toLowerCase()} team.`;
  const val=S.tone==='Consultative'
   ? `In similar transitions, we’ve seen ${p.ind.toLowerCase()} leaders get the fastest wins by targeting one high-friction workflow first before scaling across sites. Algoworks partners with teams on ${angObj.off.toLowerCase()} to accelerate that foundation.`
   : `At Algoworks, we help ${p.ind.toLowerCase()} leaders use our ${angObj.off.toLowerCase()} to cut manual coordination and scale cleanly across sites.`;
  const extra=S.len==='Detailed'?`\n\nWe recently helped a multi-site ${p.ind.toLowerCase()} team stand up their core pipeline in under 6 weeks without disrupting existing plant operations.`:'';
  const cta=`Would you be open to a 15-minute call next week to compare notes on your ${person.role} priorities?`;
  body=tpl.ch==='Email'
   ? `${greet},\n\n${hook}\n\n${S.len==='Short'?'':val+extra+'\n\n'}${cta}\n\nBest,\nGODY\nAlgoworks`
   : `${greet} — saw the news on ${p.name}’s ${priSig.t.toLowerCase()}. ${S.len==='Short'?'':`We help ${p.ind.toLowerCase()} teams with ${angObj.off.toLowerCase()} during rollouts like this. `}${cta}`;
 } else if(stepIdx===1){
  subj=`LinkedIn Connection / InMail`;
  body=`${greet} — sent you a quick note earlier this week regarding ${p.name}’s ${priSig.t.toLowerCase()}. Would love to connect here and follow your work leading ${person.dept.toLowerCase()} at ${p.name}.${S.len==='Detailed'?` Happy to share our ${p.ind.toLowerCase()} architecture playbook anytime if useful.`:''}`;
 } else if(stepIdx===2){
  subj=`Re: ${p.name}’s ${priSig.t.toLowerCase()} — case study for ${first}`;
  const mid=S.tone==='Consultative'
   ? `When teams pair ${priSig.t.toLowerCase()} with ${secSig.t.toLowerCase()}, data handoffs between sites usually become the hidden bottleneck.`
   : `Following up on my last email — wanted to share a quick relevant benchmark as you focus on ${angObj.t.toLowerCase()}.`;
  const proof=`We worked with a similar ${p.ind.toLowerCase()} organization to deploy our ${angObj.off.toLowerCase()}, cutting cross-site reporting lag by 64% in the first quarter.`;
  body=tpl.ch==='Email'
   ? `${greet},\n\n${mid}\n\n${S.len==='Short'?'':proof+'\n\n'}Worth a quick 12-minute chat this Thursday or Friday to see if a similar approach fits ${p.name}?\n\nBest,\nGODY\nAlgoworks`
   : `${greet}, quick follow-up: we helped a peer in ${p.ind.toLowerCase()} cut cross-site data lag by 64% using our ${angObj.off.toLowerCase()}. Open to a brief chat this week?`;
 } else {
  subj=`Closing the loop — ${p.name} × Algoworks`;
  body=tpl.ch==='Email'
   ? `${greet},\n\nI know things are busy with ${priSig.t.toLowerCase()} at ${p.name}, so I won’t keep crowding your inbox.\n\n${S.len==='Short'?'':`If ${angObj.t.toLowerCase()} or ${angObj.off.toLowerCase()} becomes a priority later this quarter, I’d be glad to reconnect.\n\n`}Either way, wishing you and the ${p.name} team a smooth rollout.\n\nBest,\nGODY\nAlgoworks`
   : `${greet} — know your plate is full with ${priSig.t.toLowerCase()}. I’ll pause outreach here, but let me know if ${angObj.t.toLowerCase()} becomes a priority down the road!`;
 }
 return {step:tpl.step,day:tpl.day,label:tpl.label,ch:tpl.ch,goal:tpl.goal,subj,body,appr:false};
}

function ensureSeq(pid,forceRegen=false){
 const p=PROSPECTS[pid];
 if(!S.sequences[pid]||forceRegen){
  S.sequences[pid]=SEQ_TEMPLATE.map((_,idx)=>buildStepContent(p,idx));
 }
 return S.sequences[pid];
}

const pSwitcher=()=>`<div class="p-sw"><span class="mut" style="font-size:12px;font-weight:700">ACTIVE PROSPECT:</span>${Object.values(PROSPECTS).map(p=>`<button class="chip ${S.pid===p.id?'on':''}" onclick="switchP('${p.id}')">${p.name}</button>`).join('')}</div>`;

const sigCards=(p,pick)=>{
 const list=p.signals.filter(x=>S.filter==='All'||x.cat===S.filter);
 if(!list.length)return `<div class="card mut">No signals in category "${S.filter}" for ${p.name}.</div>`;
 return list.map(x=>`<div class="card sig ${pick&&p.sel.includes(x.id)?'sel':''}" ${pick?`onclick="tg(${x.id})"`:''}>${pick?`<input type="checkbox" aria-label="Select ${x.t}" ${p.sel.includes(x.id)?'checked':''}>`:''}<div style="flex:1"><div class="row" style="justify-content:space-between;gap:8px"><h3>${x.t}</h3><span><span class="tag">${x.cat}</span> <span class="tag ${x.r}">${x.r}</span></span></div><div>${x.s}</div><div class="mut" style="margin-top:6px"><b>AI reasoning:</b> ${x.why}</div><div class="mut" style="font-size:12px;margin-top:4px">Source: ${x.src} · Published ${x.d} · Verified</div></div></div>`).join('');
};

function intel(){
 const p=curP();
 const T=['Overview','Signals','People','Sources'];
 const cats=['All',...new Set(p.signals.map(s=>s.cat))];
 const highCnt=p.signals.filter(s=>s.r==='High').length;
 let h=`${pSwitcher()}
 <div class="row" style="align-items:center;flex-wrap:wrap"><div style="flex:3 1 300px"><h1>${p.name}</h1><div class="mut">${p.domain} · ${p.ind} · ${p.loc} · ${p.emp} · Researched ${p.date}</div></div><div style="display:flex;gap:8px;flex:0 0 auto"><button class="btn sec" onclick="toast('Refreshing research for ${p.name}…')">Refresh research</button><button class="btn" onclick="go('angles')">Outreach angles →</button></div></div>
 <div class="tabs" role="tablist">${T.map(t=>`<button class="tab ${S.tab==t?'on':''}" onclick="S.tab='${t}';render()">${t}</button>`).join('')}</div>`;

 if(S.tab=='Overview'){
  h+=`<div class="grid"><div class="card dark" style="grid-column:span 2"><h2>Company summary</h2><p>${p.summary}</p><span class="tag" style="background:var(--pri);color:#1c1640">AI summary · based on ${p.signals.length} verified sources</span></div><div class="card green"><div class="mut">Signals found</div><div class="big">${p.signals.length}</div></div><div class="card lav"><div class="mut">High relevance</div><div class="big">${highCnt}</div></div></div>
  <div class="grid"><div class="card"><h2>Recent developments</h2>${p.signals.map(x=>`<div class="ev"><span>${x.t}</span><span class="mut">${x.d}</span></div>`).join('')}</div><div class="card"><h2>Decision-makers (${p.people.length})</h2>${p.people.map((person,idx)=>`<div class="ev"><span><b>${person.name}</b> ${idx===p.contactIdx?'<span class="tag ok" style="margin-left:6px">Primary</span>':''}</span><span class="mut">${person.role}</span></div>`).join('')}</div></div>`;
 }

  h+=`<div class="row" style="flex:none"><div style="display:flex;gap:6px;flex-wrap:wrap;flex:1 1 100%">${cats.map(c=>`<button class="chip ${S.filter==c?'on':''}" onclick="setF('${c}')">${c}</button>`).join('')}</div></div>${sigCards(p,true)}<div class="card dark row" style="align-items:center"><div><b>${p.sel.length} signal${p.sel.length==1?'':'s'} selected.</b> <span class="mut">The AI will pick one primary signal and use the rest across your multi-step sequence.</span></div><button class="btn" style="flex:0 0 auto" ${p.sel.length?'':'disabled'} onclick="go('angles')">Continue to angles</button></div>`;
 }
 if(S.tab=='People'){
  h+=`<div class="grid">${p.people.map((person,idx)=>`<div class="card ${idx===p.contactIdx?'lav':''}"><h2>${person.name}</h2><div><b>${person.role}</b> · ${person.dept}</div><p>${person.bio}</p><div class="mut" style="font-size:12px;margin-bottom:12px">${person.li}</div><button class="btn ${idx===p.contactIdx?'inv':'sec'}" onclick="selectContact(${idx})">${idx===p.contactIdx?'Selected contact ✓':'Select for outreach'}</button></div>`).join('')}
  <div class="card"><h2>Add another contact</h2><label>Full Name</label><input id="nc_name" placeholder="e.g. Sarah Jenkins"><label>Role & Department</label><input id="nc_role" placeholder="e.g. VP Engineering · Technology"><button class="btn sec" style="margin-top:12px" onclick="addContact()">+ Add decision-maker</button></div></div>`;
 }
 if(S.tab=='Sources'){
  h+=`<div class="card tw"><table><tr><th>Source</th><th>Information</th><th>Category</th><th>Published</th><th>Retrieved</th></tr>${p.signals.map(x=>`<tr class="lk" onclick="toast('Opening ${x.src}…')"><td><b>${x.src}</b></td><td>${x.t}</td><td><span class="tag">${x.cat}</span></td><td>${x.d}</td><td>${p.date}</td></tr>`).join('')}</table></div>`;
 }

window.selectContact=idx=>{

window.addContact=()=>{
 const name=$('#nc_name')?.value.trim();
 const roleRaw=$('#nc_role')?.value.trim()||'VP Technology · Technology';

 const [role,dept]=roleRaw.split('·').map(s=>s.trim());

 p.people.push({name,role:role||'Decision Maker',dept:dept||'Leadership',bio:`Added manually to ${p.name} buying committee.`,li:`linkedin.com/in/${name.toLowerCase().replace(/\s+/g,'-')}`});
 p.contactIdx=p.people.length-1;
 ensureSeq(p.id,true);
 toast(`Added and selected ${name}`);
 render();
};

window.setStepCh=ch=>{
 const seq=ensureSeq(S.pid);
 seq[S.stepIdx].ch=ch;
 seq[S.stepIdx].appr=false;
 render();
};
window.regenStep=()=>{
 const p=curP();
 const seq=ensureSeq(S.pid);
 const idx=S.stepIdx;
 if(idx<SEQ_TEMPLATE.length){
  const fresh=buildStepContent(p,idx);
  fresh.ch=seq[idx].ch;
  seq[idx]=fresh;
 }
 render();
};
window.updSubj=val=>{
 const seq=ensureSeq(S.pid);
 seq[S.stepIdx].subj=val;
 if(seq[S.stepIdx].appr){seq[S.stepIdx].appr=false;toast('Edited. Step approval revoked.');render()}
};
window.updBody=val=>{
 const seq=ensureSeq(S.pid);
 seq[S.stepIdx].body=val;
 if(seq[S.stepIdx].appr){seq[S.stepIdx].appr=false;toast('Edited. Step approval revoked.');render()}
};
window.approveStep=()=>{
 const p=curP();
 const seq=ensureSeq(S.pid);
 seq[S.stepIdx].appr=true;
 const apprCount=seq.filter(s=>s.appr).length;
 p.outreach=apprCount===seq.length?'Approved':`Draft (${apprCount}/${seq.length})`;
 toast(`Step ${seq[S.stepIdx].step} approved`);
 if(S.stepIdx<seq.length-1)S.stepIdx++;
 render();
};
window.approveAll=()=>{
 const p=curP();
 const seq=ensureSeq(S.pid);
 seq.forEach(s=>s.appr=true);
 p.outreach='Approved';
 p.status='Completed';
 toast(`All ${seq.length} sequence steps approved for ${p.name}!`);
 render();
};
window.addFollowUpStep=()=>{
 const p=curP();
 const seq=ensureSeq(S.pid);
 const num=seq.length+1;
 const day=`Day ${num*3+1}`;
 const person=p.people[p.contactIdx]||p.people[0];
 const first=person.name.split(' ')[0];
 seq.push({
  step:num,day,label:`Follow-up #${num-1}`,ch:'LinkedIn',goal:'Share new industry insight or quick check-in',
  subj:`Follow-up touch #${num-1}`,
  body:`Hi ${first} — sharing a quick thought on how ${p.ind.toLowerCase()} leaders are approaching AI governance this quarter. Let me know if you'd like the full benchmark report!`,
  appr:false
 });
 S.stepIdx=seq.length-1;
 p.outreach=`Draft (${seq.filter(s=>s.appr).length}/${seq.length})`;
 toast(`Added Step ${num} (${day})`);
 render();
};
window.exportSeq=()=>{
 const p=curP();
 const seq=ensureSeq(S.pid);
 toast(`Exported ${seq.length}-step sequence for ${p.name} as CSV & DOCX`);
};
